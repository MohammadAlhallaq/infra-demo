services:
  app:
    build: .
    image: infra-demo-app
    container_name: app
    restart: unless-stopped
    volumes:
      - ./.env:/var/www/.env
      - app_storage:/var/www/storage
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q php-fpm || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./public:/var/www/public
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

volumes:
  app_storage: