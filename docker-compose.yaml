services:
  app:
    build: .
    image: infra-demo-app
    container_name: app
    volumes:
      - ./.env:/var/www/.env
      - app_storage:/var/www/storage

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./public:/var/www/public
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

volumes:
  app_storage: